[project]
name = "talos-demo"
version = "0.1.0"
description = "Notes with tags — the test project for TalosSDLC runs"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=notes --cov-fail-under=80"
